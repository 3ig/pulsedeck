# Pushing a tag like v1.2.3 builds every download and publishes a release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make app VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Pulsedeck-macos.dmg

  linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      - run: make installer packages VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            dist/Pulsedeck-windows-setup.exe
            dist/pulsedeck-windows.exe
            dist/pulsedeck-linux-*.deb
            dist/pulsedeck-linux-*.rpm
            dist/pulsedeck-linux-*.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Optional: with the ANDROID_KEYSTORE_BASE64 secret set, the APK is signed
      # with the project's own key so new versions install over old ones.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "PULSEDECK_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          PULSEDECK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -PappVersion="${GITHUB_REF_NAME#v}" -PappVersionCode="${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Pulsedeck-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Pulsedeck-android.apk

  publish:
    needs: [macos, linux-windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "Pulsedeck ${GITHUB_REF_NAME#v}" --generate-notes
