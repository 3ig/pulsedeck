name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o pulsedeck-ci .
      # Smoke test: the sensor collectors must start and report on a bare
      # machine (no GPU, no monitoring tools) without crashing.
      - run: ./pulsedeck-ci -sensors
        shell: bash

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check client/app.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
